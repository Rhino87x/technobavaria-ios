name: iOS → TestFlight

# Baut die Techno-Bavaria-iOS-App auf einem Cloud-Mac und lädt sie zu TestFlight hoch.
# Manuell starten: GitHub → Actions → "iOS → TestFlight" → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Xcode-Version (26+) wählen
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "Keine Xcode-26-Version auf diesem Runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle-ID, Version und Build-Nummer setzen
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'de.n8tixx.app' }}
          MARKETING: ${{ vars.IOS_MARKETING_VERSION || '2.1' }}
        run: |
          set -e
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = de.technobavaria.app;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = 1.0;/MARKETING_VERSION = ${MARKETING};/g" "$PBX"
          BUILD="$(date -u +%y%m%d).$(date -u +%H%M)"
          sed -i '' "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = ${BUILD};/g" "$PBX"
          echo "Bundle $BUNDLE_ID · Version $MARKETING ($BUILD)"

      - name: Abhängigkeiten installieren und synchronisieren
        working-directory: .
        run: |
          npm ci
          npx cap sync ios

      - name: App Store Connect API-Key ablegen
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Archivieren (ohne Signatur; signiert wird beim Export)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Entitlements (Push) ins Archiv einsetzen
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          find "$APP" -name "*.framework" -maxdepth 3 -exec codesign --force --sign - {} \; || true
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Exportieren (signieren)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "--- Entitlements in der signierten IPA ---"
          cd "$RUNNER_TEMP/export" && ls
          unzip -q -o *.ipa -d unz
          codesign -d --entitlements :- unz/Payload/App.app 2>&1 | tee ent.txt
          grep -q "aps-environment" ent.txt || { echo "::error::aps-environment fehlt in der IPA"; exit 1; }
      - name: Zu TestFlight hochladen
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
